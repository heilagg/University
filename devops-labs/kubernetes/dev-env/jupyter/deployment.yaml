apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyter-config
  namespace: dev-platform
data:
  jupyter_lab_config.py: |
    c.ServerApp.port = 8888
    c.ServerApp.ip = '0.0.0.0'
    c.ServerApp.open_browser = False
    c.ServerApp.allow_root = True
    c.ServerApp.token = ''
    c.ServerApp.password = ''
    c.ServerApp.base_url = '/'
    c.ServerApp.allow_origin = '*'
    c.ServerApp.disable_check_xsrf = True
    
    # MLflow integration
    import os
    os.environ['MLFLOW_TRACKING_URI'] = 'http://mlflow.dev-platform.svc.cluster.local:5000'
    
    # DVC integration
    os.environ['DVC_REMOTE'] = 's3'
    os.environ['DVC_REMOTE_URL'] = 's3://dvc-storage'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: dev-platform
  labels:
    app: jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      serviceAccountName: jupyter
      containers:
      - name: jupyter
        image: jupyter/scipy-notebook:latest
        ports:
        - containerPort: 8888
          name: http
        env:
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow.dev-platform.svc.cluster.local:5000"
        - name: DVC_REMOTE
          value: "s3"
        - name: DVC_REMOTE_URL
          value: "s3://dvc-storage"
        volumeMounts:
        - name: jupyter-config
          mountPath: /home/jovyan/.jupyter
        - name: jupyter-workspace
          mountPath: /home/jovyan/work
        - name: shared-storage
          mountPath: /home/jovyan/shared
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: jupyter-config
        configMap:
          name: jupyter-config
      - name: jupyter-workspace
        persistentVolumeClaim:
          claimName: jupyter-workspace-pvc
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-storage-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: dev-platform
spec:
  type: ClusterIP
  ports:
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: http
  selector:
    app: jupyter

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-workspace-pvc
  namespace: dev-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: glusterfs
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-storage-pvc
  namespace: dev-platform
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: glusterfs
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyter
  namespace: dev-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jupyter
  namespace: dev-platform
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jupyter
  namespace: dev-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jupyter
subjects:
- kind: ServiceAccount
  name: jupyter
  namespace: dev-platform

