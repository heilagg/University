# Docker Compose for Local Development/Testing
# This allows testing the platform locally without Kubernetes

version: '3.8'

services:
  # Storage - MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow-artifacts
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - mlflow-db
      - minio
    command: mlflow server --host 0.0.0.0 --port 5000

  mlflow-db:
    image: postgres:15
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data

  # Jupyter
  jupyter:
    image: jupyter/scipy-notebook:latest
    ports:
      - "8888:8888"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DVC_REMOTE=s3
      - DVC_REMOTE_URL=s3://dvc-storage
    volumes:
      - jupyter-workspace:/home/jovyan/work
      - ./templates:/home/jovyan/templates
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    command: start-dev
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_KEYCLOAK_ENABLED: "true"
      GF_AUTH_KEYCLOAK_CLIENT_ID: grafana
      GF_AUTH_KEYCLOAK_CLIENT_SECRET: change-me
      GF_AUTH_KEYCLOAK_AUTH_URL: http://keycloak:8080/auth/realms/dev-platform
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - keycloak

volumes:
  minio-data:
  mlflow-db-data:
  keycloak-db-data:
  jupyter-workspace:
  prometheus-data:
  grafana-data:

