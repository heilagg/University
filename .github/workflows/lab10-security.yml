name: lab10-security

on:
  push:
    paths:
      - "sssd/lab10/**"
      - ".github/workflows/lab10-security.yml"
  pull_request:
    paths:
      - "sssd/lab10/**"
      - ".github/workflows/lab10-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sssd/lab10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit semgrep pip-audit

      - name: "SAST 1 - Bandit"
        run: bandit -r . -f txt -o bandit-report.txt
        continue-on-error: true

      - name: "SAST 2 - Semgrep"
        run: semgrep scan --config p/python --config p/owasp-top-ten --metrics off --json --output semgrep-report.json .
        continue-on-error: true

      - name: "SCA - pip-audit"
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json
        continue-on-error: true

      - name: "Upload analysis reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            sssd/lab10/bandit-report.txt
            sssd/lab10/semgrep-report.json
            sssd/lab10/pip-audit-report.json
